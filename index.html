<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeliverEase - Unified Transportation & Logistics Platform (India)</title>
  <meta name="description" content="All-in-One Transportation & Logistics Platform for Indian shippers, commercial drivers, and fleet enterprises with 50-50 space sharing, return backhaul load optimization, live GPS telemetry on National Highways, and 10% platform commission model." />
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/map.css" />
</head>
<body>

  <!-- Top Navigation & Role Bar -->
  <header class="app-header">
    <div class="header-inner">
      <!-- DeliverEase Brand Logo -->
      <div class="brand-wrapper" onclick="window.DeliverEase.ui.navigate('booking')">
        <div class="brand-icon">📦</div>
        <div class="brand-name">
          DeliverEase <span style="color: var(--primary);">India</span>
          <span class="brand-badge">All-in-One Model</span>
        </div>
      </div>

      <!-- Role Switcher (Shipper, Driver, Enterprise) -->
      <div class="role-switcher-container" id="headerRoleSwitcher">
        <!-- Dynamically rendered -->
      </div>

      <!-- Header Profile & Actions -->
      <div class="header-actions">
        <!-- Notification Toggle Button -->
        <button class="icon-btn" id="notifToggleBtn" onclick="window.DeliverEase.ui.toggleNotifDrawer()" title="Notifications">
          🔔
          <span class="badge-dot" id="notifBadgeDot" style="display: none;"></span>
        </button>

        <!-- User Profile Pill -->
        <div class="user-profile-badge" id="headerUserProfile" onclick="window.DeliverEase.ui.openProfileModal()" title="View User Account & KYC">
          <!-- Dynamically rendered -->
        </div>

        <!-- Cloud DB Status / Config Button -->
        <button class="btn btn-secondary btn-sm" id="cloudStatusPill" onclick="window.DeliverEase.ui.openCloudModal()" title="Connect Firebase Cloud Database">
          ☁️ Cloud DB
        </button>

        <!-- Prominent Login & Register Buttons -->
        <button class="btn btn-secondary btn-sm" onclick="window.DeliverEase.ui.openLoginModal()" title="Account Login">
          🔑 Login
        </button>

        <button class="btn btn-primary btn-sm" onclick="window.DeliverEase.ui.openRegisterModal()" title="Register New Account">
          + Register
        </button>
      </div>
    </div>
  </header>

  <!-- Secondary Module Navigation Bar -->
  <nav class="module-nav-bar" id="moduleNavBar">
    <!-- Dynamically rendered -->
  </nav>

  <!-- Main View Container -->
  <main class="app-main">
    <div id="mainContentContainer">
      <!-- Dynamic Views Rendered Here -->
    </div>
  </main>

  <!-- Notification Drawer Container -->
  <div id="notifDrawerContainer"></div>

  <!-- Global Modal Overlay -->
  <div class="modal-overlay" id="globalModalOverlay">
    <div id="globalModalContainer"></div>
  </div>

  <!-- Global Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Firebase SDK for Realtime Cloud Database -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/cloud-db.js"></script>

  <!-- DeliverEase Core Scripts -->
  <script src="js/store.js"></script>
  <script src="js/modules/auth.js"></script>
  <script src="js/modules/booking.js"></script>
  <script src="js/modules/spaceSharing.js"></script>
  <script src="js/modules/warehouseReturn.js"></script>
  <script src="js/modules/driver.js"></script>
  <script src="js/modules/tracking.js"></script>
  <script src="js/modules/payment.js"></script>
  <script src="js/modules/notifications.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
